name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    # Test database for the DB tests (apps/api, *.db.spec.ts). Their global setup applies the migrations.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docsign
          POSTGRES_PASSWORD: docsign
          POSTGRES_DB: docsign_test
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docsign -d docsign_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://docsign:docsign@localhost:5432/docsign_test

    steps:
      - uses: actions/checkout@v4

      # Reads the version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The API typechecks against packages/shared/dist.
      - name: Build shared
        run: pnpm --filter @doc-signing/shared build

      # Typed lint and typecheck need the generated Prisma client (no database needed).
      - name: Generate Prisma client
        run: pnpm db:generate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      # Unit tests and DB tests (against the postgres service above).
      - run: pnpm test
