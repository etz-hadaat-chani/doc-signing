name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned so the ubuntu-latest switch to Ubuntu 26 (2026-10-19) cannot change CI by surprise.
    # Moving to a newer image is a deliberate later step.
    runs-on: ubuntu-24.04

    # Test database for the DB tests (apps/api, *.db.spec.ts). Their global setup applies the migrations.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docsign
          POSTGRES_PASSWORD: docsign
          POSTGRES_DB: docsign_test
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docsign -d docsign_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Catches the emails of the email tests (SMTP 1025, API 8025). Same image as docker-compose.yml.
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports:
          - 1025:1025
          - 8025:8025

    env:
      TEST_DATABASE_URL: postgresql://docsign:docsign@localhost:5432/docsign_test
      # MinIO for the storage tests (started below); the adapter creates the test bucket.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      TEST_S3_BUCKET: documents-test
      # Email: the mailpit service above; the tests read the emails back through its API.
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      EMAIL_FROM_ADDRESS: no-reply@doc-signing.local
      APP_PUBLIC_URL: http://localhost:5173
      HR_CONTACT_PHONE: 02-0000000
      MAILPIT_API_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@v7

      # Reads the version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The API typechecks against packages/shared/dist.
      - name: Build shared
        run: pnpm --filter @doc-signing/shared build

      # Typed lint and typecheck need the generated Prisma client (no database needed).
      - name: Generate Prisma client
        run: pnpm db:generate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      # Same image as docker-compose.yml. Not a `services:` entry: those can't pass `server /data`.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 \
            server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      # Unit tests and DB tests (against the postgres and mailpit services and MinIO above).
      - run: pnpm test
